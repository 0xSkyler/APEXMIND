[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apexmind"
version = "0.3.0"
description = "Execution-aware cross-venue perpetual futures research"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiohttp==3.13.5",
  "numpy==2.3.5",
  "scipy==1.17.0",
  "scikit-learn==1.8.0",
  "joblib==1.5.3",
  "threadpoolctl==3.7.0",
]

[project.optional-dependencies]
live = ["lighter-sdk==1.1.6"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.15.7"]

[project.scripts]
apex = "apexmind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apexmind = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
